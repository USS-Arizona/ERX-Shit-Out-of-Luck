enc_sol.1.t: "America, the comatose." 
enc_sol.1.d: "America was once a dream. And that dream burned. Its holdings in ruins, its people astray and unaware of who they once were. Unfamiliar even with the ideas of who their ancestors were. Its once powerful and vast industrial capacities were stripped of all use and resources, or left to collapse as the metal husks of their old world they’ve become. The world-dominating military power scattered to the winds, dead and destroyed, scavenged and reused by the new powers. \n\n America has been sent into a coma, with its lands brought under usurpation by conquering tribal, warlord states, raider gangs, Roman pretenders, and more."
enc_sol.1.a: "America is a tune, and it must be sung together."

enc_sol.2.t: "SEND DISTRESS SIGNAL"
enc_sol.2.d: "The Sierra Army Depot. The current last holdout of the known American government. It was a battered, scavenged, rusted mess in disrepair. But it would have to do, as it is all that’s left in control of the American government. Sergeant Dornan, by now an older man whose prime years were long behind him. He sat inside the main communications room of the SAD, which was in a state of disrepair. It was only on emergency reserve power, with only two lights on, that gave a small, red, dim light, enough to light the room. Just barely. Dornan sat in a chair facing the communications terminal. It had a single command on it. \n\n He sat there, contemplating, debating with himself. Was the American Century truly over? Should he just let the dream finally be what it should remain, A dream? He sat there, arguing with himself in his head, growing increasingly angry with his own thoughts. Like they weren’t his own, but he had to face reality. The American Dream was probably dead. And for good this time. Dornan had to run from Vault City just a little while ago with those who chose to accompany him. The Rangers had finally found him. He knew he was in a desperate situation. He had a mixture of women, children, and old men in the SAD, and here he was, sitting in its comms room. Then it hit him. He needs to do this. Damn the Brotherhood, Damn Vault City, Damn New Reno, and finally, Damn the NCR! \n\n They think they can get rid of America THAT easily? Even if the NCR catches them, they’ll undoubtedly go down swinging. With him having made up his mind, Dornan sent the command on the terminal, sending the distress call on old Enclave transmissions, sending calls to New Reno, Vault City, Oregon, Redding, Navarro, Eureka, and even Shady Sands. \n\n Very few arrived, slowly trickling in over time. But those from military service were typically older men, still fondly remembering Richardson’s presidency between the ages of 60 and going as far as their 90s as well, alongside young teenagers with patriotic fervor or being there as someone would kill them for the Enclave lineage, who probably held a gun only a few times in their entire lives, if even. \n\n The SAD itself was a sad, nearly destroyed mess. Not unlike America itself, it serves as a perfect analogy. However, it held its real treasures underground, with its bunker complex buried beneath the desert sands, protecting the families who moved into the SAD alongside the soldiers, armories, and treasure troves within the R&D labs. \n\n Most of the people were desperate; those who knew their times in the NCR were limited, with Rangers soon catching on to who they actually were, or those desperate enough to pack up everything they had to follow the words of some aging Enclave Drill Sergeant."
enc_sol.2.a: "It’s a long shot, but to achieve it, everything must be done, including the impossible."

enc_sol.3.t: "Cloak and Dagger..."
enc_sol.3.d: "'1..13..5..18..9..3..1..' Numbers. That’s all this station has been playing for the past month now. It popped in out of nowhere, and that’s all it ever played. Usually, it’s just been dead air, but sometimes it’s static. PFC Jacob scratched the back of his bald head. He had always been a bit of a radio fanatic and knew every station that his ham radio set reached by heart. This got him his job with the NCR Army in the Signal Corps. \n\n But this one? It was a new one. He didn’t know what to make of it, whether it was some kids with a radio set playing around, or maybe a government conspiracy. '1..21..12..4..12..1..14..7..19..25..14..5..' He eventually called over one of his friends, Corporal Martinez got up from his desk and walked over to what Jacob was going on about. \n\n 'Are you going on about those numbers again?' Jacob seemed annoyed by Martinez’s dismissal of his concern, replying with, 'This could actually mean something, be something big!' With Martinez slowly replying with '...It could be a pre-war Chinese broadcasting station, or it could mean absolutely nothing.' \n\n With that, Martinez left Jacob to his own devices and returned to his desk, filing action reports and communications, leaving Jacob to his own devices."
enc_sol.3.a: "'It’s a load of junk data…'"

enc_sol.4.t: "Shadow of The Red Menace"
enc_sol.4.d: "'Howdy, Pardners, this is Modoc Murphy, live from Lovelock! I must preface this next segment by stating that it is, in fact, sponsored by the New Reno Government. Communists! What are they and what do they believe? Well…' \n\n After a slight pause, like he didn’t know exactly what to say, Murphy started back up, 'I can certainly tell you what they aren’t! It certainly isn’t Americanism; they want to destroy what we have left! That dastardly Red Menace, what’s to destroy what is left of America there is and give it all to their Chinese-sponsored state terrorists!' \n\n After a slight sigh, and hearing some rustling of paper from inside the studio Murphy recorded from, 'Buuut…My sponsors do want to preface my previous comments with this next statement: While Communism is a dangerous ideology and attracts the most violent out there, our own local homegrown Shi are not the causes of communism, and are American as you or I an-.' \n\n With that, the radio cut off. Bai had heard enough. He turned off the radio in his workshop, killing the noise outside of machinery, drilling, and tool work. \n One of the workers walked up to Bai, Aiguo. He spoke up, 'You can’t let it get to you. They are simply discussing what they know. Not what they’ve seen.' Bai sighed and ran his fingers through his black hair, gently rubbing his scalp to calm himself down. 'You’re right. Just hard to hear these New Renoans talk about us inadvertently, and know nothing of our history.'"
enc_sol.4.a: "'I’ll believe it when I see it, Aiguo.'"

enc_sol.5.t: "Going Live on 5, 4, 3, 2..."
enc_sol.5.d: "For the first time in over 200 years, based in the town of Lovelock, the radio crackled to life. 'Howdy, Pardners, this is Modoc Murphy, starting up this radio broadcast for the first time, thanks to the help of the friendly fellers in the Government over in New Reno. And with their help, this broadcast will be a regular thing!' \n\n Modoc Murphy has always been a charismatic feller, able to talk his way into and out of any situation. But he wasn’t all silver words and golden bells; he was able to hold his own in a fight and survive in the wastes. When the Government approached him, he was skeptical of the offer, feeling it was a gilded cage of a deal, one that allowed him to say whatever he wanted, as long as it was positive for the New Reno government. And occasionally reading a coded or encrypted message from a mysterious figure from the city. \n\n The radio broadcast was able to reach far and wide, extending far beyond the state of New Reno’s borders, even into NCR territories such as Redding and Sac-Cty. Over the coming months, the unofficially backed and funded broadcast station was able to spread new life into the wastes, giving the average people new hope and a new means of communication. For those who even had radios, that is."
enc_sol.5.a: "'This is Modoc Murphy, signing off and putting on some music!'"

enc_sol.6.t: "Fresh Off the Presses"
enc_sol.6.d: "With the rejuvenation of New Reno, thanks to the new Granite administration and the improvement in the average quality of life, thanks to some entrepreneurs in New Reno, along with work from civilian contractors, an old newspaper has been given new life. This is achieved through the hiring of a new CEO and the recruitment of civilian journalists. \n\n Thomas Walker is one of those said civilian journalists. His most significant defining factors that led to him getting this job are that he’s able to read and write proficiently, as well as ask the right questions at the right time naturally. Due to those fortunate combinations of traits and skills, he now works for the New Reno Journal as an investigative journalist."
enc_sol.6.a: "'Extra, Extra!'"

enc_sol.7.t: "Snap Back to Reality"
enc_sol.7.d: "Dornan knew it. He could feel it in his bones. He couldn’t lead forever. \n\n Furthermore, he knew people still looked up to him for guidance, strength, moral support, and so much more. He was the reason they were all back here at the Sierra Army Depot anyway, but factions were forming, lines were being drawn, and people were starting to fight. Even the more neutral personnel he knew were falling to either side. \n\n While the arrival of Granite and Anderson was greatly needed, they did not help alleviate the growing infighting problem, which was soon to boil over if something didn’t happen, which is why Dornan couldn’t lead forever. His once brown hair is now silver and gray, his stature and frame still mighty, but not what they once were back in his DS days in Richardson’s Enclave. Not to mention, he was tired of all these people calling him ‘Sir’; he works for a living, damn it. \n\n So, he couldn’t lead forever; he eventually had to choose his successor, as whoever he backed, he knew, would win the election. He was the current leader, after all; as much as he didn’t like that role, he still had to use it correctly."
enc_sol.7.a: "'What have you gotten yourself into, Dornan…'"

enc_sol.8.t: "American Rebirth"
enc_sol.8.d: "This was it. The day of a new age. That’s at least what Granite said to himself, but he certainly didn’t feel like it. America was barely alive, as this was all that remained. The NCR and Brotherhood ensured that, and with Navarro now being deemed a ‘territory’ currently embroiled in a civil war. The Sierra Army Depot is what was left of America. \n\n Granite hadn’t reached the podium yet, technically not even being President, though being chosen by Dornan, the current de facto leader of the Enclave. And yet people already looked to him with hope, reverence, and pride, hoping he would save America. And yet, those calling themselves Purists looked at him like a mutant sympathizer, the son of a traitor and one himself, a bastard son, and the death of the Enclave and America. \n\n Right before reaching the podium on stage, he looked at his close personal friend Boris, in a rare moment of character break from Granite, with worry and desperation in his voice, he asked him,"
enc_sol.8.a: "'Is this it? Is this truly what is left of America?'"

enc_sol.9.t: "American Nightmare"
enc_sol.9.d: "Anderson waited, off-stage. He had won. Dornan, being the good soldier he is, decided the right man for the right job. This was a formality anyway, considering how significant his backing was, with over 50% of the people here backing him, if not backing him outright, then supporting or liking him. \n\n He looked at the audience as he was being introduced. He saw Granite in the crowd, and he smiled at him, with Granite grimacing back at him, as there wasn’t anything he could do. After this inauguration, Granite was to be killed, and if he somehow failed, he was sure he wouldn’t see Anderson ever again, likely running back to Oregon or somewhere more eastward. The Inauguration was extremely makeshift, considering there wasn’t the Chief Justice to swear him in, or any judges at all. So instead of swearing him in, they had to make do, and so Dornan swore in Anderson as President. \n\n After that, the speaker called Anderson to the podium, he approached it and shook their hand, with them going behind him. And then he began to speak. \n\n 'Greetings, residents of the Sierra Army Depot. This is a truly special day for the Enclave and America. Instead of choosing the mutant lovers, those who would damn America and throw her into the gutter, you all chose me, and I have to thank you for this. A true chance to lead the Enclave and bring her to her former glory, before the Chosen One blew up the oil rig, and before the nuclear hellfire brought us to where we are now. This is a New Day, The Birth of a New Age, The American Century shall live again and continue!' \n\n The audience practically gave him a standing ovation, except for the few hardline reformers who had left earlier or refused to participate in the ad-hoc inauguration celebrations of Anderson."
enc_sol.9.a: "'Thank you all, God Bless The Enclave, God Bless America, and no one else!'"

enc_sol.10.t: "A lack of, well... everything."
enc_sol.10.d: "Staff Sergeant Markus Wilson looked everything up and down his clipboard once again, giving a slight groan out of annoyance. It wasn’t due to how much he had to tally down, quite the opposite, not to mention how much they had to accept captured, bought, or even stolen equipment, and that equipment being of extremely varying qualities. \n\n And don’t even get Wilson started on weaponry and personal armor. He surveyed the state of the weapons stockpile. While he inspected them, many were still the old M16A7s that had been commonly issued. He still had some R91S and Colt Rangemasters. Still, he also had been forced to accept…alternatives from captured, bought, or outright stolen weaponry, ranging from simple pipe weapons, makeshift or handmade guns, to more well-produced weapons from the NCR or Gun Runners, or even old-world military surplus firearms. All of it is a pain to keep track of, alongside having to hold onto so many different ammo types, which makes his armory look more like a military surplus store. \n\n Wilson looked over to his clipboard again. Body armor is a vital piece of equipment every soldier needs to protect themselves daily. Body armor was another crap shoot, while the Sierra Enclave still had a stockpile of old combat armor, that stockpile was running low, with them resorting to alternatives, and those alternatives ranged from unit to unit. Wilson had gotten his hands on some padded metal armor he had haggled with a trader for, giving him a box of 200-year-old MREs. He wasn’t really supposed to do that, but he could get in trouble for it later. \n\n Power Armor is the biggest hurdle he has to deal with. Their logistics costs are like those of tanks. Thanks to the last 30 years of running around the wasteland ever since the Rig went tits up, to say ‘there’s been a lack of supplies’ is an extreme understatement. Most PA units barely had any proper armor. Sure, they had the frames, but they’d kill you with their bare hands before making the stripped PA the NCR uses. As a result, much of their armor consisted of frames with scavenged or handmade armor welded onto them. Sure, some Officers or soldiers were able to hold onto their APA or make do by adding features from older models, such as the T-51 or T-45, but they had to create a vast smorgasbord of mishmashed PAs. \n\n The supplies were a true hellhole that anyone had to wade into. From lacking ammunition, replacement parts, or modern weapons to being completely lacking in everything needed, including even the basics like food and water. It wasn’t just a ‘challenge’. It was a Sisyphean Task. Not only that, but it was an outright miracle if things even made it to the front and weren’t lost, intercepted, or delivered to the wrong company."
enc_sol.10.a: "'The Army Marches on Its Stomach…'"

enc_sol.11.t: "Soldiers of Fortune"
enc_sol.11.d: "Robert Vinson was in his office, dealing with paperwork on his own, sighing as the day came to an end. As one of the older officers in the army who wasn’t a Purist, and with his experience, he was quickly promoted to make up for the difference. He was an old Granite Company merc and watched by Sr’s side as the rig blew up on that hauler full of tribals, refugees, and the Chosen One, and still remembers what he thought as the rig blew up, \n\n 'Well. There it goes.' \n\n After the rig blew up and they all went into Shi with the Chosen One, following the removal of the hubologists by the Chosen One, the Granite company considered settling down and integrating with Shi. However, the Battle of Navarro soon occurred. And they realized integration wouldn’t be easy. And so, they ran upwards. Upwards all the way past Navarro and into Eureka, making it their home. And used the only skill they had. Combat. So they became mercs. He’s been there since Granite Company was officially a combat company within the Enclave, where it became a Mercenary Outfit and now…They don’t really know what they are now. Although the group of six men had each other, they were off duty and drinking in a bar in the recently conquered New Reno. \n\n Integration has been a bitch for Granite Company, having been Mercs for the past 30 years creates a different mindset than that of an Enclave trooper, though the old reflexes and discipline never leave you properly. Troops were accustomed to being paid directly after every mission, although some looting occasionally occurred. Now they were paid bi-weekly, and looting was forbidden, even a court-martial-worthy offense. He had to remind some of the former mercenaries that looting was off the table, even when fighting the New Reno families and seeing their vast wealth. Still, they were thankfully captured and given to the Government to use in its budget. \n\n Not to mention the squad tactics, Granite Company mercenaries were utilized for operations in Company- or Squad-based teams, employing a shock-and-awe style of warfare, albeit restricted due to a lack of supplies. Now? They were being evolved into official large-scale warfare, with modifications to deal with the wasteland’s combat style. The transition was rough for some of the troops. They weren’t used to so many people around, and so many fresh faces as well. Sure, the Granite Company picked up some stragglers now and then and took them on, but they ensured to place that American Discipline into them, with fervor that Dornan would be proud of. \n\n Vinson looked over his office, which was filled with hours of paperwork, and delegated his actual duties to the soldiers under him. He sighed and quietly spoke to himself,"
enc_sol.11.a: "'Let's hope this one lasts...'"

enc_sol.12.t: "Siege of Serpent Cradle"
enc_sol.12.d: "Private Joshua Locke looked over the scene, being designated as spotter for his sniper team. He saw Serpent Cradle; it was burning ahead of him. He heard over the radio of the higher-ups requesting to firebomb it to hell and back, but being denied by Command on the grounds of civilians being inside the settlement and forcing the troops to clear it out with street fighting and urban warfare tactics. \n\n Invading the Vipers wasn’t too difficult a task, on paper, that is, as they were really a semi-organized group of cultish raiders. In practice? It had been a challenge. The Enclave lacked supplies, proper communications, fresh blood, and so much more. The lack of supplies and logistical difficulties were more significant than those faced by the Vipers, though their poisoned weaponry did not help. Initially, Locke was a part of the Vault City Security before leaving with the mass exodus of Enclave refugees who accompanied Dornan. He had just been a good shot, so he was assigned to the recon teams. \n\n He advised his partner on occasion to take a shot at the still-fighting Vipers, trying to avoid panicking civilians. He finally spoke up after minutes of spotting and shooting, 'Jeez…A lot of carnage, right?' \n\n His partner, Ronald, looked up to him, an older man in his early sixties, yet he held only the rank of staff sergeant. He was the leader of the recon team, picking off targets with the Wattz 2000 laser rifle. He cleared up and spoke up to Locke and said, 'I’ve seen worse. This is them being nice right now.' \n\n '..Huh…'  Locke didn’t know really how to take that, seeing how much carnage they were really causing, even if both of the army’s arms were tied behind their backs and had been defanged from years of lack of proper use. Even when given all these disadvantages, they still knew they could fuck up any raider’s day out there. \n\n And then he saw something, A Viper running, running as fast as they possibly could. He didn’t know if they were running for their lives or had seen them and decided to make a mad dash. He pointed this out to Ronald, only for the Staff Sergeant to say, 'This one is yours. Fresh blood has to eat.' \n\n With that, Locke unslung and raised his M16A7, took aim at the Viper who was now bending over and panting for his breath, and- He saw the Viper fall over, having fired, and his rifle’s bullet meeting its target. Ronald didn’t even look up from his position as he spoke up, '“Good work. Now go finish him off. You don’t want him to survive and try to crawl over and stab you.' \n\n And so Locke walked over, rifle slung over his back and unholstering his N99 sidearm, looking to the ragged, bleeding viper raider, who gave them an ugly look and began to speak, 'Do your wo-'"
enc_sol.12.a: "Locke fired his pistol into the Viper’s head — his first confirmed kill."

#FINISH THIS ONE
#enc_sol.13.t: "Snake on the Run"
#enc_sol.13.d: "Vincent ran. Ran as fast as he possibly could. More than he ever thought possible, and for the first time in a very long time, he truly feared for his life. This wasn’t fit for a Viper Warrior, but right now, it did not matter. All he knew was that he had just to keep running. He bled down his shoulder and arm, his tribalistic tattoo of a snake coated in his blood from his gunshot wound. \n\n He looked back behind him, and he saw three vertibirds circling Serpent Cradle, but holding off from firing, like they were restraining themselves. He had seen these massive men in black, slaughtering entire teams of Viper Warriors. At first, they pushed them back with holy vengeance fired from their blessed weaponry, that was until the golden eyes of power armor fell upon them, their poisoned blades and bullets rendered impotent by the armored hulls of fury.   In some areas of Serpent Cradle, smoke lifted from the scene, buildings and huts burning in the desert sun. He had heard stories from his grandfather before he died, of the ‘Mercans’ and the bug-eyed men and how he’d fought them in Navarro as a merc hired by the NCR to supplement their forces as an auxiliary. They fought like rabid beasts until they either all died or meekly ran, killing score after score of enemies. \n\n Finally, after what felt like forever to Vincent, he stopped running, his lungs not letting him. He put his hands on his thighs, bending over and panting like a dog in the sun. Then he heard it before he felt it. A crack, a gunshot. He fell over, this time hitting him in the back. He was unable to move, stricken with exhaustion and pain. The last time he felt this much pain was during his initiation as a Viper Warrior. \n\n He heard footsteps from behind him, approaching him in the desert sands. He looked upwards and saw the barrel of a pistol pointed at him. He grimaced, about to speak,"
#enc_sol.13.a: "Do your wo-"

enc_sol.14.t: "An Unequal footing."
enc_sol.14.d: "Shouting, yelling, protesting, and multiple near-fights that quickly get broken apart by Military Police units. Unfortunately, Corporal McDougal received a first seat ticket, as he was part of the aforementioned Military Police units. \n\n A near-riot was about Granite’s decision to integrate the wastelanders. Sure, they had gotten rid of all the hard-line purist members, but not the softer members, nor the reformers who were less keen on integration. The wastelanders were still viewed as second-class citizens, or, in some eyes, as less human than others. \n\n McDougal didn’t really care; he was just paid to ensure troops followed the law, but due to the current lack of police units, he had to make sure civilians followed the law as well. And currently, his job was containing the current mob of yelling people. He saw someone with a megaphone on the protesters’ side yell out, 'THIS NEW ACT OF INTEGRATION IS UNAMERICAN! UNCONSTITUTIONAL! IT WISHES TO DESTROY THE AMERICAN PEOPLE AND TO TURN THEM INTO THE UNWASHED MASSES OF RADIATION TREATED MUTATED WASTELANDERS THAT OUR ‘PRESIDENT’ HOLDS DEAR!" \n\n Well. At least they didn’t call him a traitor this time. McDougal then heard orders from his side, Clear them out. They equipped gas masks and began to launch riot canisters into the crowd, having them disperse from the chemicals being wafted into the crowd, having them spread out to arrest them and separate the hoard from one another easily. \n\n The man with the megaphone yelled out again, 'THEY WISH TO SILENCE US! TO REMOVE US! THE REAL RED BLOODED TRULY HUMAN AMERICANS AND PLACATE TO THE MUTANTS! SEE HOW THEY TREAT THE REAL HUMANS! SEE HO-' He was then shut up, having the megaphone ripped away from him by an MP and arrested, dragged behind the riot shield lines. \n\n McDougal watched this from his position, chuckling lightly as he watched before getting back to his position."
enc_sol.14.a: "Integration at a heavy cost."

enc_sol.15.t: "Anybody Home?"
enc_sol.15.d: "Dead Signal. That's all Winters ever got. He was designed as a 'Communications Technician', supposed to monitor all incoming Terminal messages from other Enclave bases, most importantly Control Station Enclave... though they weren't likely to see any messages from them anytime soon, considering they were blown up on the bottom of the sea floor with President Dick Richardson and Frank Horrigan. \n\n Because of that, Specialist Corey Winters has resorted to monitoring radio waves, and thanks to some old pre-war tricks, they have been able to intercept some of the NCRF's radio traffic. That is, unless the NCR started using courier pigeons and motorcycle messengers again, which wasn’t out of the picture for them. \n\n He looked over the terminal, bored. Waiting for something to happen, anything to happen. He then idly looked to his fellow technician, Casey Monroe, and she gave him a similar look of boredom and expectation. She finally broke the silence and said, 'So, what the hell are we supposed to do all god damn day?' \n\n He gave a pregnant pause, like he was thinking of a proper response before saying, 'Well, officially. We are monitoring the old terminal networks. Say MainComm wants to get in touch, or I dunno, some Enclave base comes back to life, we’ll see it.' \n\n 'I thought we were MainComm now.' She said towards him with a tone of incredulity. '...Shit, you’re right. Regardless, until something pops up, we make reports and monitor the radio waves. Such as seeing if the NCRA is making any moves, or if raiders have set up another pirate radio channel.' ”
enc_sol.15.a: "The door was knocked on, but no one answered."

enc_sol.16.t: "Rumors and Legends"
enc_sol.16.d: "The Enclave was just that. A rumor and a legend, old stories told by the NCR brass to keep Jingoism going, a boogeyman for grandparents to say to their grandkids to make them behave, old-world ghosts seeking a lost land as per tribal shamans, and a lost genocidal people stuck with a bad case of the Old World Blues to any current ‘historian’. \n\n It’s what Tom had learned, at least in his years of living in Dayglow, that is. The Enclave was everywhere and nowhere, like an invisible ghost still reaching and influencing the modern people. The truth was, he was the son of Enclave remnants who ran after Navarro went down. \n\n The Enclave was still something that had to be watched out for, squashed, and taken out the second it was spotted, like a radroach infestation. \n\n Yet, the NCR used the same old-world jingoism and American spirit that the Enclave loved to call upon, as if they knew who was hiding out in Dayglow. Hell, Mayor Hayes was very popular among certain Dayglow residents for a reason."
enc_sol.16.a: "But it is as if anyone would say they are The Enclave."

enc_sol.17.t: "A Change in Old Course"
enc_sol.17.d: "Corruption has always been in The Enclave, going back to The Cabal and back towards Old America in the 1960s, and even further than that. Corruption has always been around politics and bureaucracy. But with the Enclave? It was practically a holy tenet. While being made up of ‘America’s Elite’ does come with its advantages, such as the smartest and brightest minds, it also includes the most powerful and richest in the government, society, and the military. \n\n But it went beyond corruption; it turned into cronyism and nepotism, and by the time the Oil Rig went down, it was basically one big nepotistic floating city. And that's the challenge Grayson faces now. He looked over his new desk, which was clearly older than he was but slightly refurbished for his office as attorney general of New Reno. \n\n He took it all in, being in an actual position for the American Government again… Or at the very least, a proper continuation of it. It was slightly overwhelming for him…Only for a moment, though. He quickly got to work, and one of his first goals? Getting rid of the stain of Old America’s elite that still permeated long after their deaths. \n\n It wouldn’t be easy. But someone had to do it."
enc_sol.17.a: "Dirty Hands, Dirty Money."

enc_sol.18.t: "Freedom 1-5, this is Eagle 2-3"
enc_sol.18.d: "Warrant Officer Roy ‘Ace’ Halloway quickly flew over the desert sands of Nevada inside his Vertibird, rapidly approaching their location. New Reno. They could see the firefights below of Enclave Auxiliary forces alongside their PA counterparts against the families, mercenaries, and ad-hoc militias of New Reno, trading bullets, lasers, or even rocket fire. \n\n He heard over the radio from his co-pilot, Lieutenant Sanders, “Ace, we've got less than an hour’s worth of fuel left. We gotta make this count.” He simply gave his co-pilot a thumbs-up, and they got to work. They flew over the warring city, with a team of 2 other vertibirds following in a wedge formation. \n\n After a moment of prep, they dropped their payloads, unleashing some old-world might onto New Reno gangsters. They were told to limit the loads due to wanting to preserve some of the city and logistics restraints, but they used what they could work with; either way, hell was going to rain down on these ingrates. \n\n All 3 of the Vertibirds swooped down and carpet bombed the city, blowing the hostile positions and barricades to kingdom come, with road, building, and hostile alike being blown into smithereens by the blasts. He looked behind him, seeing the damage he and his co-pilot had caused to the gangs, and smiled, seeing the carnage unfold. \n\n Once they lifted back up, they turned to head back towards the hangars inside the Sierra Army Depot. “32 minutes until arrival, Ace. We can make it, just don’t vary from the given flight plan.” Halloway chuckled lightly before speaking into the radio towards the lieutenant, "
enc_sol.18.a: "“Ain’t War Hell?”"

enc_sol.19.t: "Russian Ingenuity"
enc_sol.19.d: "Lance Corporal Colleen Schmidt held her rifle. Gate duty. As damn usual. She was watching for anyone approaching, checking IDs, stopping passers-by, allowing or rejecting people entering the SAD. She was the typical Enclave Auxiliary, black combat armor, fatigues, and a Kalashnikov-style rifle. \n\n She stood at the ready, rifle in hand. It was a bit funny, though; she was always told this rifle was inferior. Surplus. Un-American due to its origins as a Soviet invention, and later turned into a Chinese weapon. It was heavier than the standard M16 or the AER9, and it roared as it fired, but it would have to do. But the rifle was her father’s rifle, and her father’s father’s rifle, going so far as her ancestor who fought against the Russians in Vietnam. It was a war trophy and a well-taken care of one at that. Even if it was generations old at this point, her family was damn lucky to have it still around anyway. \n\n That was until recently, and a hastily promoted Lieutenant saw her with that said rifle and complained to his superiors in the chain of command. “It’s not standard issue,” he said. “We don’t have the ammo in production.” “It's a useless artifact of a world that doesn’t exist.” “It's Un-American,” were the arguments given. “It is a communist made inferior weapon.” She knew the weapon was an antique, but at the same time, she hadn’t been issued anything else besides a standard N99 Pistol, which wasn’t fit for work outside of being a sidearm."
enc_sol.19.a: "Retire the rifles. They’re Un-American. We can buy or make new ones."
enc_sol.19.b: "Keep the rifles in Auxiliary formations only. We need all we can get right now."

enc_sol.20.t: "A strain in communications."
#enc_sol.20.d: "Fox gets called a huge fucking gay crybaby with shitty little sonic fan fics by Kaiser and gets laughed at by Granite."
enc_sol.20.a: "(Eddie Fox gets yelled at by Major. Kaiser for constantly mispronouncing city names.)"

enc_sol.21.t: "City in Turmoil"
enc_sol.21.d: "The city burned. Warfare raged in the streets of Redding, chaos thriving on the streets of Redding. The industrial center of Northern California and the home of the Barons. And it wasn’t the Enclave’s doing…completely. The NCR Army had pushed forward outside of the city, ignoring the Baron’s cries to defend their homes, to go and fight the Enclave forces. \n\nThe Barons took that personally. They decided to attempt a coup with Anton Flynn at the helm and to become a city-state, and wanted to make a peace deal with the Enclave. With it, the Barons mobilized their loyalists, brought NCR units and mercenaries, and went for a quick power grab in the city.\n\nThen the local workers and their unions fought back, seeing the writing on the wall for an oppressive oligarchic industrial state, and so they put on the red bandanas and grabbed their rifles and tools, intent on fighting back against this coup and turning into red-wearing revolutionaries.\n\nThe local NCR Garrison cried for help to the NCRA and held out for how they could fight against the quickly mobilizing militias, mercenaries, and partisans of the Barons and Unions. But nothing arrived due to the entire NCR army fighting the Enclave, minus a few garrison units defending cities and border units trying to maintain some cohesion of the border with other nation-states.\n\n"
enc_sol.21.a: "On the horizon, the Enclave approached."

enc_sol.22.t: "Difference in Perspective"
enc_sol.22.d: "“Get to work! Caesar demands it. Or I’ll have your ears.” After that, the Decanus slammed the door to the makeshift laboratory behind them, with them locking it from the outside. Inside were two bomb-collared slave-researchers. One Robert McCraw and One Sister Stacy Fitzpatrick. \n\nRobert sighed, his once clean, white researcher suit now dirtied by abuse, dirt, and sand, with the golden dome of a helmet being removed a long time ago, to make the collar fit. He leaned over the counter with an array of parts, burnt blueprints, and a single, barely functioning terminal. He spoke up towards Fitzpatrick, “So what is it the ‘great and mighty’ wants us to research now? How to make actually functioning tools? Or is he going to demand another pre-war super weapon?” \n\nThe woman was clearly a Scribe, and one a long way from home. She was covered in more injuries than her Government counterpart, mostly small injuries and bruises. She was going over some ancient R&D folders from a lab some Legionary scouts had recently gone through. “This time, he’s demanding some air abilities. He’s heard of the mighty air forces Nevada and California have been brewing up, and he doesn’t want to miss out on the action.”\n\nRobert gave a scoff, “Planes? Seriously? I thought this guy was all about going back to the Bronze Age.” He then gave a slight sigh, “You know, I don’t think you ever told me, What Chapter are you from?” \n\nShe gave a small smile, not one out of love for her fellow scientist, but because her past was finally being acknowledged. Even if it was by all sense, her enemy. “Well. We weren’t exactly a chapter. We were too small and too underfunded to be called that. The closest chapter was out in the Midwest. I was a part of the Maxson Expedition in Colorado.” \n\nRobert spoke up, “Huh, I’ve heard of them. Mostly through rumors, though. Something to do with stealth-boys and misfits.” The Scribe gave a light nod, response being, “It was true, we had a decent population addicted to stealth-boys. We tried to treat them how we could. That was until Lanius showed up.”\n\n"
enc_sol.22.a: "After that, the room went quiet. And they got to work."

enc_sol.23.t: "One of the Bear’s Heads"
enc_sol.23.d: "Charlotte Abbot was an NCR Congresswoman. At least that’s what she was telling herself nowadays. She was born and raised in Shady Sands, She remembers when it was still an agricultural hub, and now one of the industrial hubs of California. But not that it’d matter for much else now.\n\nThe Enclave of old was invading Shady Sands. Mayor Hayes was in Dayglow and rumored to be even collaborating with the Enclave, Kimball had gone running for the hills with an army cell trying to wrangle what was left of his supporters, and Allgood was nowhere to be seen with him last being heard trying to coordinate refugee efforts with the followers.\n\nShe could hear the explosions of combat outside of the NCR Congressional Building, rapid gunshots, explosions of rocket launchers and tanks fighting in the streets. NCR Rangers fighting against Enclave Power Armor, like it was 2246 again. This time though, it was in the birthplace of the Republic. \n\nShe was being escorted by some NCR Rangers out of the area, with them being given orders to get the hell out of dodge, as for all they knew the Enclave was still up for killing everyone that wasn’t them. That was until they ran right into an armored convoy riding down Seth Boulevard. A large combined arms force of power armor, tanks, apcs and infantry. Seeing not much choice, the Rangers beside her surrendered. NCR Rangers knew when they were beaten. Considering she was still of political authority, she formally surrendered to the officer in charge of the convoy.\n\nThe Major scratched at his muttonstache as he heard the words the congresswoman spoke, with her offering her immediate surrender as a political prisoner of war. He accepted the terms immediately and handed her over to the military police units following his convoy, where she was searched and later questioned.\n\n"
enc_sol.23.a: "She would be held until the end of the war, where she would be released and retire to her home of Shady Sands."

enc_sol.24.t: "Sun Set Avenue"
enc_sol.24.d: "(Battle of Dayglow, mixture of Enclave sympathizers in the streets fighting NCR Loyalists and NCR Enforcers, and the Enclave army gets there fully in time to watch some remnants of the NCR leave via their navy, to escape the Enclave.)"
enc_sol.24.a: "todo"

enc_sol.25.t: "Another Foe"
enc_sol.25.d: "The NCR was defeated. Scattered to the hills and winds. Their Government, or what’s left of it, had surrendered. Its army had been sent home. And its people were now compliant with the rule of Enclave law. All in theory, at least.\n\nIn reality, the NCR was defeated, yes, but the fight and the long war were far from over. NCR Loyalists held out in the cities and rural communities, creating resistance cells, plotting to take their homes back from the invaders. The former NCR Government, at least the members of it we could capture, the higher heads of staff have been put under house arrest, with us unsure on what to do with them yet, and the ones we haven’t? They’re helping lead the resistance cells, with only a few cooperating with us. \n\nMilitias popped up all over California, the Baja, and Southern Oregon like pox, made up of former NCR Troopers, conscripts, and militias from the war, and whomever else they can get their hands on. And the people, some cities like Redding, Shady Sands, and the Boneyard burned, with riots spreading out and our Military Police units trying to keep and maintain order in them.  While in other cities like Dayglow and Sac-City, there was a harsh tension in the air between the Enclave Troops and NCR Citizens, with a sort of de facto peace going on. \n\nMany former NCR Generals, Officers, Commanders, or people of influence have run for the hills and helped lead the militia cells, the new war no longer being a conventional war with the NCR, but a second, now guerrilla war with them. With us having to keep the peace of the citizens and swiftly deal with the NCR Resistance, it’s a fine line we desperately need to deal with, otherwise the NCR will win this time."
enc_sol.25.a: "Someone…please get me some painkillers for my migraine. I can tell this will be a long battle."

enc_sol.26.t: "Dreamland’s Residents, Part 1"
enc_sol.26.d: "It was a top priority for the Enclave; that's at least what Lieutenant Johnathan Hawke was told by his superior officer, for it contained all sorts of pre-war secrets. And not the standard sort of secrets that hide out in a pre-war base. He remembered hearing rumors of Area 51 while growing up, including stories about aliens, super-secret stealth fighters and bombers, alien technology, and more.\n\nAnd now he had to help clear it out and recapture it. The Sky Reavers were a raider group that practically worshiped the Pre-War facility. They had some minor aerial abilities, but nothing beyond a few prop and biplanes. They had attempted to strafe a few of his patrols, but were quickly taken care of by some rocket launchers.\n\nFor a raider group, they weren’t holding up terribly. Fighting for what they could to preserve their ‘holy ground’. Though like the Gangsters in New Reno and the Vipers, most unorganized ‘troops’ tend to run at the sight of power armor and an automatic weapon.\n\nThere were orders from the President himself to minimize damage to Area 51 as much as possible, as they needed to get the facilities up and running ASAP. So, unfortunately, bombing the shit out of them was off the table. So that meant they had to manually and personally clear them out."
enc_sol.26.a: "Let’s see those Aliens!"

enc_sol.27.t: "Dreamland’s Residents, Part 2"
enc_sol.27.d: "“Move up! We’re busting through!” Hawke was yelling over the radio of his makeshift APC’s comms system. Hawke looked forward through the APC’s slits and saw they were rapidly approaching the fence and planning on breaching through it alongside 3 other APCs and whatever men they had inside.\n\nThen, with a loud clatter and bang, the lead APC made contact with the old perimeter fence and ran through it. The entire APC felt it shake as they ran over it, including the men inside. Once they got close enough to the hangars, the APCs stopped, and the men inside ran out, with the APCs giving covering fire for them to move towards proper positions.\n\nHawke and a squadron of his men were included, with him helping lead the charge. Then they saw one of the old hangar doors open, and they saw the remains of a 200-year-old fighter jet, which had been cannibalized for the weapons, and they saw a raider heavy weapons team attempting to use said weaponry. Hawke yelled out, “TAKE COVER!” before he ran behind some impromptu cover.\n\nWith that, the 20mm Rotary Cannon began to open fire, using it to shred any infantry it could get its eyes on and blowing up one of the APCs with its ancient weaponry, before two of the APCs targeted their guns onto the fighter-jet’s weaponry, killing the raider weapons team.\n\nBy the end, the quick battle was starting to wind down, with a few of his men dead, but many more raiders dealt with. He gave a slight chuckle as some firefights continued to play out in the background. He looked to his living men and smiled, seeing his boys were still alright."
enc_sol.27.a: "He then threw back on his tough NCO Personality and yelled at them."

enc_sol.28.t: "Dreamland’s Residents, Part 3"
enc_sol.28.d: "Kronos was dead. The leader of the Sky Reavers. He lay on the floor, the visor of his gas mask broken from the large hole put into it. He was the only thing still holding this warband together from the onslaught of the Pre-War Ghosts. Wallach, the closest thing to a second-in-command they had, was still alive. \n\nHe looked around the plane hangar, with raiders who were either panicking for their lives or too strung up on chems to care. His boss was just killed by a large-caliber round from a sniper. One of the underlings, Brody, a raider ‘pilot’ before all of their planes were shot down, spoke up, “Uh. Wallach. You’re boss now… What do we do?”\n\nHe stood still for several seconds, the sounds of combat audible right outside, with the enemy soon approaching their location. He gripped his 10mm SMG like he was going to fight, but realized he couldn’t win this skirmish. So, for the first time in a long time, he thought clearly and set his gun onto a nearby table and said, “We are going to surrender. Kronos is dead, and these people seem determined to get this place.”\n\nAnother Underling spoke up, Mad One Eye, raider team leader. And a brutal one at that. “Fuck that! We can fight! We can do this, we can k-” He was then cut down by a single bullet to his head, by Wallach’s sidearm, having the now former-raider fall to the concrete floor dead. “You are forgetting I am the Boss now. And what the boss says goes. And I say we are giving up. If you have a death wish, you can stay. But I say we are surrendering. I’ve seen these people take prisoners, so I say we go.”\n\nWith that, Wallach holstered his sidearm and walked towards the hangar bay door, with most of his men following, and his hands raised in the air, where an Enclave squad was about to breach. \n\n"
enc_sol.28.a: "They were all taken prisoner. "
enc_sol.28.a.tt: "And tried in the court of law, some were hanged, some were sent to rehab facilities, but most were taken into the newly reconstructed prisons."

enc_sol.29.t: "Dreamland’s Residents, Part 4"
enc_sol.29.d: "The cold heels of boots clacked down the steel interiors of the bunker. Two pairs. One more firmly set, the other quieter, like trained from years of stealth work. \n\nClack. Clack. Clack. Clack.\n\nEventually, they stopped. Arriving where they wanted to be. The taller man looked to the other officer, ‘Colonel Callahan, I’ve heard tales of your…work.’ Work implied something else. Work was a less-than-adequate term to use for what the Colonel did. He did wet work, espionage, all for the Stars and Stripes, all for the American Dream. \n\nThe Colonel seemed to relish in the other man’s hidden distress. He could see through it, through the subtle facial expressions and the way the fellow officer held himself, ‘But to prove my loyalty to America and the Enclave, I have something to show you inside.’ \n\nThat piqued Callahan’s interest, with a single eyebrow raising as the officer went to open one of the doors inside the bunker, leading to an officer’s mess, but a hand leading to his holster in case this went the way he thought it would. With an ID swipe and a series of rough mechanical sounds from the door, it opened, and lo and behold…\n\nIt’s Red Splendor. Glowing bright, shining like an Angel in the Darkness of hell. A low hum, giving a comforting sound, comparable to the hum of a mother to her newborn child. Its magnificence, like a towering beacon of the Old World, and its glory of commercialism, old luxuries, and a statue to excess. \n\nCallahan looked towards the General, wide-eyed, seeing the beast of the Old World. A still functioning Nuka-Cola fridge. Still working, after 200 years from the Great War. A beauty and pièce de résistance of Callahan’s collection.\n\nImmediately, Colonel Callahan looked towards the General,"
enc_sol.29.a: "“You’re clean, General Jackson. Welcome back to America.”"

enc_sol.30.t: "It’s Noon Somewhere"
enc_sol.30.d: "(Purist Botanist tries to duel Callahan after Callahan gives him some vague planted evidence that sets him off. A ‘good samaritan’ who’s an agent in disguise helps shoot the botanist.)"
enc_sol.30.a: "todo"

enc_sol.31.t: "Fear and Loathing"
enc_sol.31.d: "(Enclave comes across a small UFO/Alien themed diner named ‘Little A’Le’Inn’ by Area 51, run by two ghouls, Gather S Lewis and Eddie Kaminski. Gather being a conspiracy nut and reference to Hunter S Thompson and Eddie being a pre-war spook with ties to the Cabal/Enclave who never got into MAINCOM due to bad luck and bad timing.) Maybe an X-Files-based event chain where they hunt down anomalies"
enc_sol.31.a: "todo"

enc_sol.32.t: "Rising Sun"
enc_sol.32.d: "(Battle of the Yakuza territories, with the broken samurai trying the damndest to fight off enclave forces, with some success but not for long, with Yakuza expecting to be honorably killed but instead surprised to be taken as PoWs.)"
enc_sol.32.a: "todo"

enc_sol.33.t: "The Electric Problem"
enc_sol.33.d: "Rolling blackouts were a frequent problem in New Reno. They were a minor issue in the city before the Enclave arrived, but they have only gotten worse due to the strain on the power grid. Sure, the reactor in the SAD helped, but it could only supply so much. \n\nInside the SAD Reactor Control rooms, two technicians were talking. A bald, clean-shaven tech spoke up, “Power keeps spiking, but it remains nominal. It isn’t too out of the norm considering its age, and now much strain is on it.”\n\nThe other tech, a blonde-haired younger man, was going over printed reports, “She wasn’t built to do this much, Power the SAD? Sure. Maybe a small settlement around it. But help power an entire city and the surrounding communities? No way.”\n\nThe bald technician gave a slight nod as he looked over the control panel, monitoring it, “As I said before. There is a lot of strain on it. New Reno does have some generators on its own that help the city, but many of them have been diverted or just cannot keep up.” \n\n“We need to get a bigger generator on the block. Like the Gecko power plant. Or the Vault City reactor. It’s not like we can just make a bunch of gas generators as well, though. I mean, the resource wars happened for a reason,” The blonde-haired man said as he looked towards the shielded reactor itself, the over 200-year-old beast of energy still churning out power proudly."
enc_sol.33.a: "To tame the Wastes and regain America, the Enclave needs to get a hold of its power crisis."

enc_sol.34.t: "Vault-Tec Branded Specialists"
enc_sol.34.d: "“Gah! Damn it! I told you not to overload the damn thing!” Markus Finch quickly backed up from the now-overloading and sparking transformer. The Senior Technician quickly ran over to the kill switch and flipped it, killing the power to the transformer. He looked over to his trainees, all wearing black technicians’ wear.\n\nHe had recently been hired by the New Reno government. Not only that, but he used to be one of the more senior technicians with Vault City. Plenty of the senior staff of VC didn’t want to or care to work with the New Reno Gov. Sure, they had gotten rid of plenty of their mobsters and had seemingly become a legitimate government. But they were still…wastelanders. \n\nHe was one of the few senior personnel from VC who would work with them. And so, now he was in charge of the ‘New Reno Department of Energy,’ and because of the lack of experienced personnel, he was currently having to train new personnel. \n\nHe wished he had more experienced coworkers; sure, some were…scarily proficient at their jobs, but they were few and far between…And seemingly closer to being his grandfather in age than a coworker. But most of the new guys were hardly trained. They knew how to connect some wires, but that’s really it. \n\nOne of the younger trainees, a boy only the age of 19, spoke up, “Uh…Does this mean we failed…?”\n\nFinch only responded by putting a hand on his shaven, bald head and said,"
enc_sol.34.a: "“It means we are going to keep training.”"

enc_sol.35.t: "Popping One’s Balloon"
enc_sol.35.d: "In the decades and centuries after the Great War, the ultimate show of martial supremacy was the airship. Massive, invulnerable, untouchable; the worst nightmare of the average wasteland raider. The Brotherhood seeded the wastes of old America with their massive fleets of dirigibles cobbled together from the scraps of technology left behind by their forefathers. Even now, over two centuries after the bombs fell and conventional planes were grounded for good, Brotherhood air jockeys flew their zeppelins around the wasteland, cowing rivals into turning over for technology in exchange for protection or otherwise being left alone.\n\nSergeant Zach Browning of 1st Battalion, 174th Air Defense Artillery Brigade smiled as he saw one of the Washington Brotherhood’s blimps come into view in his binoculars. It was long, with grey steel-armored plating covering both sides and a battery of artillery guns pointing downwards to the ground below. It had emerged from behind a tall hill (or small mountain-he wasn’t able to tell the difference) flanked by two smaller, unarmored airships. Bold white letters proclaimed the name of the large airship: PLATNER. The trio of airships banked to the south, where a battle between Brotherhood paladins and American infantry was taking place in the ruins of a long-abandoned town. No doubt the Platner’s guns were supposed to help even the odds.\n\n“We have a targeting solution yet?” Sergeant Browning asked his soldiers. Private Vasquez looked up from the small terminal hooked up to Nike’s fire control system and gave her sergeant a thumbs-up. “Fire when ready.” Vasquez keyed in a few commands and hit ‘enter.’ The massive anti-air missile’s engine ignited and launched the rocket almost too fast for Browning to register. He watched the missile’s exhaust trail scream across the sky, making a beeline for the armored airship. He smiled as the airship shuddered mid-air when the missile’s warhead penetrated and then exploded deep inside its superstructure. Flames started and quickly spread across the entirety of Platner’s spine. The soldiers of the 1st Battalion cheered as the ship sank in the sky like a stone, wreathed in flame.\n\n"
enc_sol.35.a: "The bigger they are, the harder they fall. "

enc_sol.36.t: "A Centurion’s Lament"
enc_sol.36.d: "It was blistering hot, hot enough for even a Legionnaire to melt in his boots. Centurion Gaius Magnus walked down the row of shrouds with his hands balled into tight fists, sweat running down his face under his golden plumed helmet. Beside him was Vulpes Inculta, the head of Caesar’s Frumentarii and one of His most trusted men. The glorified spy wore his fox-head helmet, shielding his eyes from the hot sun and cementing his authority among the legionaries tasked with cleaning up this mess.\n\nA barren stretch of highway in the middle of the desert turned into a massacre of Legionnaires. A slave caravan transporting a large group of slaves taken from the Mojave to the famed Morenci mine on the other side of old Arizona. They were expected by the mine’s guard two days ago; a patrol dispatched by Magnus found the remains of the caravan a few miles south of Great Phoenix. A few overturned carts, a destroyed motor-chariot, half a dozen bloated brahmin carcasses, and around two dozen dead legionaries.\n\nFrom what could be gathered, they had lost two decanii, both prime in rank, and twenty legionaries in the raid. The exact casualties were murky, due to poor record-keeping in Cottonwood Cove and the fact that several of the bodies had been disintegrated by laser and plasma-based weaponry. There was also no telling how many slaves had been lost, but one of the Frumentarii who had experience in slave-catching estimated the number to be around thirty. \n\n“It seems these so-called Americans have continued to impede our slave drives. Retaliation against our raids into their territory.” Vulpes said, “You are merely the latest victim in their return strikes.” Magnus suppressed a growl, hiding his desire to throttle the snake in human skin. This was the fourth of his slave parties to be ransacked by the Black Devils from across Colorado. The arrogance of this off-putting fox-man angered him even more.\n\n“I’ve seen this before,” Magnus spat, “Arizona, Zion, The Mojave, Pecos, Yuma, and Havasu.” He stopped at the foot of a corpse whose head had been exposed from underneath the sackcloth shroud. The helmet had a neat, bloody bullet hole right under the plume of feathers stitched to the top. He growled and kicked a rock. It clattered on the broken asphalt until it hit the bashed remains of a slave collar."
enc_sol.36.a: "“But these are MY men.”"

enc_sol.37.t: "Not Seen Since 2073"
enc_sol.37.d: "The last time American tanks heavily roared against another armored foe was in 2073 during the Gobi Campaign, alongside sniper battles and American PA forces tearing apart PLA Tanks. But this was a new battle.\n\nMajor. Kaiser’s tank roared against the desert sands towards the now NCR-controlled Fort Irwin, not too far away from Baker, and where the Long 15 turned into I-40. The ‘Queen of War’ was a bitch of a tank, a refurbished M60 Patton with new technology strapped onto and into it. \n\nThis was probably the largest tank battle of the entire NCR-Enclave war. If not, of the post-war wasteland. From what he could gather, the Enclave had 227 tanks, while Recon reported that the NCR had about 150. Give or take.\n\nAs well, Enclave was supported by APCs, some robots, infantrymen, and even 6 Vertibirds. While the NCR had armored cars, infantry, Rangers, even more militiamen, and some Bear Force wings from Edwards AFB.\n\nWhile the Enclave did have the numerical advantage in tanks, the NCR had the quality advantage in theirs. Kaiser looked towards the 3 other men inside his tank. With the column ahead racing for the fight about to commence, he spoke up and said,"
enc_sol.37.a: "“Let’s Win for America, boys.”"

enc_sol.38.t: "Gunner, Heat, Forward!"
enc_sol.38.d: "The 105mm barrel roared as it fired its load into the NCR Grizzly right ahead of them, blowing the turret off the tank and killing the Californian crew inside. The Gunner gave out a laugh as they got to live for a while more, succeeding in the battle so far.\n\nMajor. Kaiser’s radio was going crazy, reports from other tanks and officers going nuts, making it difficult to tell what was happening, but what he had seen so far was that the NCR had ambushed a smaller column around the flank of the main force, taking out plenty of Enclave tanks and vehicles. But that gave the Enclave the chance and turned that ambush into a larger one that the NCR can’t disengage from, or their own flank will be destroyed. \n\nKaiser looked out of the cupola and yelled, “Driver, forward!” With that, the M60 lurched again and moved forward, avoiding the now-burning hull of the NCR Grizzly, alongside two Enclave tanks supporting them like bodyguards. \n\nThen Kaiser saw it out of his Cupola: 3 entire Grizzly tanks. He blurted out, “Gunner, 40 degrees, 3 Grizzlies!” \n\nThat got the Gunner’s attention with a quick, “Oh, fuck!” and the loader was getting ready to load another shell after firing. The turret swung towards the tanks, and the commander spoke out, “HEAT!” With their tank firing first before the Grizzly tanks. It launched right into the leading tank, a dead-on shot in the hull, stopping it in its tracks, with the crew quickly bailing from the now dead tank. One of the two supporting tanks behind the Grizzly fired a shot, hitting the M60, but it bounced against its side. \n\nIt let out an awful noise. A loud ringing and a bang. Kaiser thought they had been killed for a moment before he realized they weren’t dead. The loader has already got to work, putting in a new shell. Behind his tank, there was an explosion, and one of the armored friendlies was blown up, leaving only one support tank. 2 vs 1.\n\nThe last grizzly fired again, hitting them again, but in the armor of the tracks. It stopped them dead, unable to move for the moment… The M60 fired again alongside the M4A2 Dawson behind them, both of them blowing up the last Grizzly.\n\nKaiser sighed in relief, and the Gunner gave out a, “Haha, Yes!” and the driver tried to get them to move. Allowing a quick moment of celebration, Kaiser then spoke into the radio, "
enc_sol.38.a: "“This is Major Wagner…Requesting cover while we fix our tread.”"

