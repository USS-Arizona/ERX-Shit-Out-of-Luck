enc_sol.41.a: "todo"

enc_sol.42.t: "Ruthless yet Discreet"
enc_sol.42.d: "(Post Conquering New Reno, Van Graffs get dealt with/contracted. Both as energy weapon suppliers for the time being and while the Enclave is rebuilding their factories, as mercenaries for some work, but held under a tight leash, with the enclave forcing them to go legit in their territories as well.)Before Navarro, there were only two real major suppliers of energy and plasma weaponry in the wasteland. The Brotherhood of Steel and The Enclave. When the Salvatores in New Reno suddenly started showing up with laser weapons of their own, that brought a lot of wandering eyes onto New Reno. Which in itself was a part of the Enclave’s downfall the first go around. \n\nNow, energy weapons are more common. Not enough for the NCR to hand them out to everyone in the army, but enough for some wastelanders or civilians to have their own energy weapons. And the Van Graffs is a criminal enterprise based around high tech energy weapons. More than enough for the Brotherhood to melt in their suits over. But we aren’t the Brotherhood."
enc_sol.42.a: "todo"

enc_sol.43.t: "Too bloody for our tastes"
enc_sol.43.d: "(Van Graffs get dealt with. Enclave sees them as a criminal enterprise and treats them as such, with them throwing the book at Van Graff's members. Mama Graff flees New Reno for Redding or Dayglow, bitterly while her criminal enterprise falls apart in Nevada.)"
enc_sol.43.a: "todo"

enc_sol.44.t: "Damn You, Brett!"
enc_sol.44.d: "The Blueprints for the M4A2 Dawson. The approval records for the M4A2 Dawson. The Design notes. The committee approval boards. The testing boards. All of it and more, all had one name that kept popping back up. Brett Sesden. Over and over again. It turns out there's a reason for why. Brett was somehow the lead designer for the Dawson. Something that should have been a mark of shame, he held as a badge of glory. At least pre-war.\n\nMajor. Wagner looked over the small mountain of pre-war papers, holotapes, blueprints, design documents, and more. Brett Sesden. He could feel the name burning into his mind, burning with hatred. A man who had deliberately designed an obtuse, incompetent, underpowered, illogical, double-barreled tank. He couldn’t tell if that pre-war ghost haunting him was just mentally deficient and incompetent or if the reds bribed him to make the worst but fanciest-looking tank possible for the Americans to use. Or some worse third option he couldn’t possibly think of.\n\nHe couldn’t believe that someone would intentionally design something so awful that it legitimately got troops killed, stalled advances, and cost American resources due to how badly it was designed. Yet the proof was right in front of him, alongside the dozens of recovered M4A2 Dawsonns sitting in their inventory that they had to retrofit just to turn into actually functioning tanks completely. \n\nThe Dawson was an item of proof, while the Old World had so many wondrous items, pieces of equipment, and technology, such as Power Armor and Autodocs, not all of which were…good. Or even deserve to be remembered. Such as the Dawson or the dozens of firearms that were submitted to the Army that were barely functioning yet expensive designs, with some of them even having been made.\n\nIn time, Brett Sesden would thankfully be forgotten about or turned into a historical footnote about the lead designer of the worst-designed and final tank before the Great War. Wagner looked over all the documents for a little while longer before deciding that he truly had better uses of his time. Before he left, though, he looked back to the proof of incompetence in the MIC and quietly spoke to himself,"
enc_sol.44.a: "“Why in the hell was there so much graft...”"

enc_sol.45.t: "Greenbacks, not scrip!"
enc_sol.45.d: "(Enclave comes to the realization that they actually need to pay their troops and not cheer them on with can-do speeches full of derring-do and promises of revenge against the NCR. At first they try Scrip like some Brotherhood chapters do and that fails, but relent and pay their troops actual wages with actual money.)"
enc_sol.45.a: "todo"

enc_sol.46.t: "A trifold flag"
enc_sol.46.d: "A trifold flag. Folded tightly, held in firm, deliberate hands, given to soft shaking ones.\n\nA trifold flag. A symbol of the nation. A symbol of the fallen.\n\nA trifold flag. Given with the deepest condolences to the grieving.\n\nA trifold flag. Seeing home for those who could never see it again."
enc_sol.46.a: "A trifold flag. Stained with tears."

enc_sol.47.t: "A Roaring Sky"
enc_sol.47.d: "(Ranchers/Farmers hear the roaring engines of Enclave fighter jets for the first time in their lives and think it’s the rapture. Based on an old story my pawpaw told me from his childhood in 1948. - Kaiser)"
enc_sol.47.a: "todo"

enc_sol.48.t: "Across The Colorado"
enc_sol.48.d: "Ranger Mark Anderson sat at a table on a pier located at Piermaster’s Landing. Once a fishing spot for the Rapid’s, who were conquered by the NCR due to their Imperialist Expansion Doctrine. He had chosen this spot specifically, it was perfect to look across the Colorado River from, you could see parts of the Bloomfield Space Center from it, and on good days Yuma too. \n\nBehind him walked three steps of feet, each quiet from years of training and commando ops. He could still pick out the tread of the Ranger’s March though. He looked over to the three and smiled lightly as he raised a glass of brandy.\n\nTycho Jr smiled back at Anderson as he approached. Holstadt in her fancy new black Enclave Ranger gear gave a quiet nod. Rusty Shackleford was mumbling quietly to himself as he fiddled with a cigarette he was having difficulty lighting with an old zippo. Anderson broke the silence with, “Glad to see you all made it, even if one of us is full time employed now.” That gave a chuckle from Shackleford as he finally lit his cigarette. \n\nThe three settled with them taking a seat at the table with him, or in Holstadt’s case remaining standing. Anderson gave a light sigh and said, “Do…you all remember Billy Clanton?” The name gave a mixture of sad sighs, groans, more mumbling from Shackleford and quiet recognition. Billy Clanton. Once Desert Ranger, deserted and became impromptu leader of Cowboy Country. “I…finally got reports of what happened to him. Abigail wanted to tell you all personally, but she was busy helping with taking care of the NCR Resistance, so I am here instead.” \n\nAnderson went to reach for a folder but Holstadt stopped him with a hand and speaking through the voice filter on her helmet, “I think we already know. He fought like a cornered wild animal but was beaten, and he got crucified by Caesar for the crime of being an Arizonan Remnant.”\n\nAnderson nodded grimly, with the conversation turning dour even more so. Shackleford spoke up in his raspy yet deadpan voice, “Bill didn’t deserve that. He ran, but he had a family. I can’t approve it, but I get it.” Tycho Jr. spoke up, “Are there any survivors from Cowboy Country?”\n\nAnderson replied, “Barely. A few from Tohono as well. Some made it across the river. Some ran all the way to the Mojave somehow. A few tried sailing to the Baja, but some of the ships got hunted down by the Legion’s boats. Enclave picked up what they could.”\n\nHolstadt grimly replied, “All while the NCR just watched.”  That attitude is what set Abigail Lee to become the Rogue Ranger. What sent her on her warpath. What founded the Rogue Rangers. What made her hatred for the NCR. And who could blame the mindset. The NCR watched the Rangers be beaten into a pulp just so they could sweep up the remnants in the 2271 Ranger Treaty."
enc_sol.48.a: "They quietly looked across the Colorado, seeing the pale horse of the Desert Rangers ready for war."

enc_sol.49.t: "Rogue Security"
enc_sol.49.d: "(Major. Marco Geller in VC does some sabotage/terrorist actions in VC during VC-Enclave war as he stayed behind in VC.)"
